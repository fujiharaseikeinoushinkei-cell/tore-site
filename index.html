<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの自主トレ｜毎日の動きが、未来のあなたをつくる</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ 基本 ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --green:#3dbb6d; --green-d:#1f8f4e; --green-l:#e6f5e9;
  --ink:#3a2e24; --ink2:#6b5d50; --cream:#fdf8ef; --cream2:#f7efe0;
  --wood1:#c99a68; --wood2:#b98a58; --wood3:#d6a876;
  --pink:#e58fc4; --blue:#4aa3e0; --orange:#f59a2e; --teal:#2fb5a3; --rose:#ef5b8d;
  --script:"Hannotate SC","Yuji Syuku","Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
body{font-family:var(--sans);color:var(--ink);background:#e9efe6;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wood{background:
  linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.06)),
  repeating-linear-gradient(90deg,var(--wood1) 0 22px,var(--wood2) 22px 25px,var(--wood3) 25px 49px,#c29260 49px 52px,var(--wood1) 52px 80px,#b5854f 80px 82px)}

/* ============ PC／スマホ切り替え ============ */
.viewswitch{position:fixed;right:18px;top:14px;z-index:100;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid #e3e8df;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:0 6px 20px -8px rgba(0,0,0,.25);font-size:12px;color:var(--ink2)}
.viewswitch button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid var(--green);color:var(--green-d);background:#fff;transition:.2s}
.viewswitch button.on{background:var(--green);color:#fff}
.stage{display:flex;justify-content:center}
.frame{width:100%;background:var(--cream);container-type:inline-size;container-name:fr;position:relative}
body[data-view="sp"] .stage{padding:64px 16px 32px;min-height:100vh;background:radial-gradient(circle at 20% 10%,#d8ead6,transparent 55%),radial-gradient(circle at 85% 90%,#f2e2c6,transparent 55%),#e9efe6}
body[data-view="sp"] .frame{width:390px;height:min(844px,calc(100vh - 100px));overflow-y:auto;overflow-x:hidden;border:10px solid #1c1c1e;border-radius:44px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
body[data-view="sp"] .frame::-webkit-scrollbar{width:0}
body[data-view="sp"] .frame::before{content:"";position:sticky;top:0;display:block;margin:0 auto;width:120px;height:26px;background:#1c1c1e;border-radius:0 0 18px 18px;z-index:60;margin-bottom:-26px}
@media(max-width:760px){
  .viewswitch{display:none}
  body[data-view="sp"] .stage{padding:0;background:none;min-height:0}
  body[data-view="sp"] .frame{width:100%;height:auto;overflow:visible;border:none;border-radius:0;box-shadow:none}
  body[data-view="sp"] .frame::before{display:none}
}

/* ============ ヘッダー ============ */
.hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:12px 4cqw;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #eee6d6}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:44px;height:44px}
.logo b{display:block;font-size:24px;letter-spacing:.06em;color:#4a3523;line-height:1.1}
.logo small{display:block;font-size:11px;color:var(--ink2);letter-spacing:.04em;margin-top:2px}
.nav{display:flex;gap:26px;margin-left:auto;margin-right:150px}
.nav a{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#4b3d31;padding:8px 2px;position:relative;white-space:nowrap}
.nav a:hover{color:var(--green-d)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--green);border-radius:2px}
.burger{display:none;margin-left:auto;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;font-size:22px}

/* ============ ヒーロー（映像でひきつける） ============ */
.hero{position:relative;overflow:hidden;min-height:470px;background:
  radial-gradient(ellipse at 8% 85%,rgba(95,160,80,.45),transparent 38%),
  radial-gradient(ellipse at 2% 40%,rgba(80,140,70,.38),transparent 30%),
  linear-gradient(100deg,#d5e4c9 0%,#e8efd9 28%,#f6efdd 55%,#f7efe0 100%)}
.hero-photo{position:absolute;right:0;top:0;height:100%;aspect-ratio:580/385;max-width:76%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.hero-photo .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate;transform-origin:70% 40%}
.hero-photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,1%)}}
.hero-copy{position:relative;z-index:3;padding:64px 4cqw 56px;max-width:50%}
.hero-kicker{font-family:var(--script);font-size:30px;color:#3b4c3a;transform:rotate(-5deg);display:inline-block;position:relative;padding:0 10px;margin-bottom:6px}
.hero-kicker::before,.hero-kicker::after{content:"";position:absolute;top:50%;width:18px;height:2px;background:#3b4c3a;opacity:.6}
.hero-kicker::before{left:-14px;transform:rotate(60deg)}
.hero-kicker::after{right:-12px;transform:rotate(60deg)}
.hero h1{font-family:var(--script);font-weight:700;font-size:clamp(34px,5.4cqw,64px);line-height:1.12;color:#3b3a3a;letter-spacing:.02em;text-shadow:0 2px 14px rgba(255,255,255,.7);transform:rotate(-2deg);transform-origin:left}
.hero h1 em{font-style:normal;color:var(--green);font-size:1.28em;margin-left:.05em;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.hero-sub{font-size:clamp(15px,1.7cqw,20px);font-weight:700;line-height:1.6;color:#33281f;margin:20px 0 22px;text-shadow:0 1px 8px rgba(255,255,255,.8)}
.cta{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(90deg,#43c378,#6dd68e);color:#fff;font-weight:700;font-size:15px;padding:16px 28px;border-radius:999px;box-shadow:0 10px 22px -8px rgba(40,160,90,.65);transition:.25s;animation:float 3.2s ease-in-out infinite}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(40,160,90,.75)}
.cta .pl{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:9px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero-script{position:absolute;left:68%;top:12%;right:2%;font-family:var(--script);font-size:clamp(14px,2.2cqw,26px);line-height:1.9;color:#33505a;transform:rotate(-8deg);text-shadow:0 1px 10px rgba(255,255,255,.9)}
.hero-script span{display:block}.hero-script span:nth-child(2){padding-left:1.2em}.hero-script span:nth-child(3){padding-left:2.2em}
.play{position:absolute;left:17.8%;top:50%;transform:translate(-50%,-50%);width:clamp(86px,9.4cqw,124px);aspect-ratio:1;border-radius:50%;background:rgba(40,44,48,.52);border:2px solid rgba(255,255,255,.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;transition:.25s;z-index:4}
.play::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ring 2.4s ease-out infinite}
.play svg{width:42%;height:42%;fill:#fff;margin-left:6%}
.play:hover{background:rgba(40,44,48,.7);transform:translate(-50%,-50%) scale(1.06)}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.play-cap{position:absolute;left:17.8%;top:72%;transform:translateX(-50%);background:rgba(40,44,48,.62);color:#fff;font-size:12px;padding:6px 14px;border-radius:999px;white-space:nowrap;z-index:4}
.leaf{position:absolute;width:20px;height:28px;background:linear-gradient(135deg,#7ed69a,#2f9e5a);border-radius:0 100% 0 100%;opacity:.55;animation:drift 12s linear infinite;z-index:2}
@keyframes drift{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(40px,200px) rotate(120deg)}100%{transform:translate(-20px,430px) rotate(260deg);opacity:0}}
.rise{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}

/* ============ 特長 ============ */
.features{display:grid;grid-template-columns:repeat(4,1fr);padding:30px 4cqw;background:linear-gradient(180deg,#fbf3e4,#f5ead6);position:relative;border-bottom:1px solid #eadfc9}
.feat{display:flex;align-items:center;gap:16px;padding:6px 18px;border-right:1px solid rgba(160,130,90,.25)}
.feat:last-of-type{border-right:none}
.feat .ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 8px 16px -6px rgba(0,0,0,.25);transition:.3s}
.feat:hover .ic{transform:translateY(-4px) rotate(-6deg)}
.feat .ic svg{width:30px;height:30px}
.feat b{display:block;font-size:16px;letter-spacing:.04em}
.feat p{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:2px}
.sprout-deco{position:absolute;right:4cqw;bottom:6px;width:58px;height:70px;opacity:.9}

/* ============ セクション共通 ============ */
.sec{padding:52px 4cqw}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-kicker{font-family:var(--script);font-size:17px;color:var(--ink2);display:inline-block;transform:rotate(-3deg)}
.sec h2{font-size:30px;letter-spacing:.06em;line-height:1.25;color:#33281f}
.btn-green{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:13px 24px;border-radius:999px;box-shadow:0 8px 18px -8px rgba(40,160,90,.7);transition:.2s;white-space:nowrap}
.btn-green:hover{background:var(--green-d)}

/* ============ おすすめトレーニング ============ */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
@container fr (max-width:1080px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 10px 24px -14px rgba(60,40,10,.4);cursor:pointer;transition:.3s;text-align:left;opacity:0;transform:translateY(24px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 30px -14px rgba(60,40,10,.5)}
.card .im{aspect-ratio:210/101;overflow:hidden;background:#eee}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .im img{transform:scale(1.08)}
.card .lb{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:700;font-size:14px;padding:9px 6px;letter-spacing:.04em}
.card .tx{padding:12px 8px 6px;text-align:center;font-size:12.5px;color:var(--ink2);line-height:1.7}
.card .bds{display:flex;justify-content:center;gap:6px;padding:0 6px 14px}
.bd{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-l);color:var(--green-d)}
.bd.off{background:#f1ece3;color:#a59a8a}
.bd svg{width:12px;height:12px}
.im.phg,.vitem.phg{background:linear-gradient(135deg,var(--c1,#c9bff0),var(--c2,#8b7bd8));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92)}
.im.phg svg{width:38%;height:38%;stroke-width:1.5}
.vitem.phg .big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:34%;height:44%;color:rgba(255,255,255,.35);stroke-width:1.2}

/* ============ 動画で学ぶ ============ */
.videos{background:linear-gradient(180deg,#fff,#faf5ea)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.vitem{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;box-shadow:0 12px 26px -14px rgba(0,0,0,.5);background:#222}
.vitem img{width:100%;height:100%;object-fit:cover;transition:transform .6s;filter:saturate(1.05)}
.vitem:hover img{transform:scale(1.07)}
.vitem::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6))}
.vitem .vp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;z-index:2;transition:.25s}
.vitem:hover .vp{transform:translate(-50%,-50%) scale(1.12)}
.vitem .vp svg{width:22px;height:22px;fill:var(--green-d);margin-left:3px}
.vitem .vt{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;z-index:2;font-weight:700;font-size:14px}
.vitem .vt small{display:block;font-weight:400;font-size:11px;opacity:.9}
.soon{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);color:var(--ink2);font-size:10px;padding:3px 10px;border-radius:999px;z-index:2;font-weight:700}

/* ============ 自主トレ（PDF）の一覧 ============ */
.subhead{font-size:22px;letter-spacing:.06em;margin:44px 0 16px;display:flex;align-items:center;gap:10px}
.subhead::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--green)}
.pdflist{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pdfrow{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 22px -16px rgba(60,40,10,.5);display:flex;align-items:center;gap:14px;border-left:6px solid var(--c,#3dbb6d)}
.pdfrow .pn{font-weight:700;font-size:15px;min-width:7.5em}
.pdfrow .pn small{display:block;font-weight:400;font-size:11px;color:var(--ink2)}
.pdfrow .pb{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;justify-content:flex-end}
.pbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--green-d);border:1.5px solid var(--green);font-weight:700;font-size:12px;padding:7px 14px;border-radius:999px;transition:.2s}
.pbtn:hover{background:var(--green);color:#fff}
.pbtn svg{width:15px;height:15px}
.pdfrow .soonmsg2{font-size:12px;color:#a59a8a;font-weight:700;margin-left:auto}

const $ = (s,r=document)=>r.querySelector(s); const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
// 写真：URL・ファイルの場所（img/photo.jpg など）はそのまま、中に埋め込んだ文字列は画像として扱う
const src = d => !d ? '' : ((/^(https?:|data:|\.\/|\.\.\/)/.test(d) || /\.(jpe?g|png|webp|gif|svg)(\?.*)?$/i.test(d)) ? d : 'data:image/jpeg;base64,'+d);
const shade = c => c;  // 色の濃淡は CSS 側で付ける

/* 写真（なければ色つきの見本の画面） */
function thumb(t,cls){
  if(t.img) return `<img alt="${t.name}" src="${src(t.img)}">`;
  return `<svg class="i"><use href="#${t.icon}"/></svg>`;
}
const gradStyle = t => `--c1:${t.color}cc;--c2:${t.color}`;

/* ---------- おすすめトレーニング（目的別のカード） ---------- */
const badge = (ok,icon,label)=>`<span class="bd ${ok?'':'off'}"><svg class="i"><use href="#${icon}"/></svg>${label}</span>`;
$('#cards').innerHTML = TRAININGS.map((t,i)=>`
  <button class="card" type="button" data-id="${t.id}" style="animation-delay:${.12*i+.5}s">
    <div class="im ${t.img?'':'phg'}" style="${t.img?'':gradStyle(t)}">${thumb(t)}</div>
    <div class="lb" style="background:${t.color}"><svg class="i"><use href="#${t.icon}"/></svg>${t.name}</div>
    <div class="tx">${t.caption}</div>
    <div class="bds">${badge(!!t.video,'i-play','動画')}${badge(t.pdf.length>0,'i-pdf','PDF')}</div>
  </button>`).join('');

/* ---------- 動画で学ぶ ---------- */
$('#vgrid').innerHTML = TRAININGS.map(t=>`
  <div class="vitem ${t.img?'':'phg'}" data-id="${t.id}" data-view="video" role="button" tabindex="0" style="${t.img?'':gradStyle(t)}">
    ${t.img?`<img alt="${t.name}" src="${src(t.img)}">`:`<svg class="i big"><use href="#${t.icon}"/></svg>`}
    ${t.video?'':'<span class="soon">準備中</span>'}
    <span class="vp"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></span>
    <div class="vt">${t.name}<small>${t.caption.replace(/<br>/g,' ')}</small></div>
  </div>`).join('');

/* ---------- 自主トレ（PDF） ---------- */
$('#pdflist').innerHTML = TRAININGS.map(t=>`
  <div class="pdfrow" style="--c:${t.color}">
    <div class="pn">${t.name}<small>${t.caption.replace(/<br>/g,' ')}</small></div>
    ${t.pdf.length
      ? `<div class="pb">${t.pdf.map((p,i)=>`<button class="pbtn" type="button" data-pdf="${t.id}:${i}"><svg class="i"><use href="#i-pdf"/></svg>${p.title||'PDFを開く'}</button>`).join('')}</div>`
      : `<span class="soonmsg2">PDFは準備中です</span>`}
  </div>`).join('');

/* ---------- PDFを開く／保存する ---------- */
async function openPdf(url){
  try{
    if(url.startsWith('data:')){            // ファイルを中に埋め込んだ場合
      const b = await (await fetch(url)).blob();
      window.open(URL.createObjectURL(b),'_blank');
    }else{
      window.open(url,'_blank','noopener');
    }
  }catch(e){ alert('PDFを開けませんでした。'); }
}
function downloadPdf(url,name){
  const a=document.createElement('a'); a.href=url; a.download=(name||'jishutore')+'.pdf'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 詳細の画面（動画で学ぶ／自主トレ（PDF）を選ぶ） ---------- */
let cur=null;
function head(item){
  return `<button class="mclose" type="button" data-act="close" aria-label="閉じる">✕</button>`;
}
function media(item,inner){
  const bg = item.img ? `<img alt="" src="${src(item.img)}">` : `<div style="position:absolute;inset:0;background:linear-gradient(135deg,${item.color||'#3dbb6d'}cc,${item.color||'#3dbb6d'})"></div>`;
  return `<div class="mm">${bg}${inner||''}</div>`;
}
function viewChoice(item){
  const hasV=!!item.video, n=(item.pdf||[]).length;
  $('#mbox').innerHTML = head(item)+media(item,'')+`
    <div class="mb">
      <span class="tag" style="background:${item.color}">${item.name}</span>
      <h3>${item.title||item.name}</h3>
      <p>${item.desc}</p>
      <div class="choices" style="--c:${item.color}">
        <button class="choice ${hasV?'':'off'}" type="button" data-act="video"><svg class="i"><use href="#i-play"/></svg>動画で学ぶ<small>${hasV?'動画を見る':'準備中'}</small></button>
        <button class="choice ${n?'':'off'}" type="button" data-act="pdf"><svg class="i"><use href="#i-pdf"/></svg>自主トレ（PDF）<small>${n?n+'件のPDF':'準備中'}</small></button>
      </div>
      <div class="note">痛みや違和感があるときは、無理をせず中止して、担当の理学療法士または医師にご相談ください。</div>
    </div>`;
}
function viewVideo(item){
  const has=!!item.video;
  $('#mbox').innerHTML = head(item)+(has
    ? `<div class="mm"><video controls autoplay playsinline src="${item.video}"></video></div>`
    : media(item,`<div class="soonmsg"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>動画は準備中です</div>`))+`
    <div class="mb">
      ${item.noback?'':`<button class="mback" type="button" data-act="choice">← もどる</button><br>`}
      <span class="tag" style="background:${item.color}">${item.name}</span>
      <h3>動画で学ぶ</h3><p>${item.desc}</p>
      <div class="note">痛みや違和感があるときは、無理をせず中止して、担当の理学療法士または医師にご相談ください。</div>
    </div>`;
}
function viewPdf(item){
  const list=item.pdf||[];
  $('#mbox').innerHTML = head(item)+`
    <div class="mb" style="padding-top:26px">
      <button class="mback" type="button" data-act="choice">← もどる</button><br>
      <span class="tag" style="background:${item.color}">${item.name}</span>
      <h3>自主トレ（PDF）</h3>
      ${list.length? list.map((p,i)=>`
        <div class="mpdf"><svg class="i"><use href="#i-pdf"/></svg><b>${p.title||'自主トレ'}</b>
          <button class="pbtn" type="button" data-act="openpdf" data-i="${i}">開く</button>
          <button class="pbtn" type="button" data-act="dlpdf" data-i="${i}">保存</button></div>`).join('')
        : `<p style="margin-top:10px">PDFは準備中です。公開までしばらくお待ちください。</p>`}
      <div class="note">印刷して、見ながら取り組むこともできます。痛みや違和感があるときは、無理をせず中止してください。</div>
    </div>`;
}
function openModal(item,view){
  cur=item;
  ({choice:viewChoice,video:viewVideo,pdf:viewPdf}[view||'choice'])(item);
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); const v=$('#mbox video'); if(v)v.pause(); }
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal')return closeModal();
  const b=e.target.closest('[data-act]'); if(!b||!cur)return;
  const act=b.dataset.act;
  if(act==='close')closeModal();
  else if(act==='choice')openModal(cur,'choice');
  else if(act==='video')openModal(cur,'video');
  else if(act==='pdf')openModal(cur,'pdf');
  else if(act==='openpdf')openPdf(cur.pdf[+b.dataset.i].url);
  else if(act==='dlpdf')downloadPdf(cur.pdf[+b.dataset.i].url,cur.pdf[+b.dataset.i].title);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pdf]');
  if(p){ const [id,i]=p.dataset.pdf.split(':'); const t=TRAININGS.find(x=>x.id===id); openModal(t,'pdf'); return; }
  const c=e.target.closest('.card,.vitem');
  if(c){ const t=TRAININGS.find(x=>x.id===c.dataset.id); openModal(c.dataset.view==='video'?{...t,noback:false}:t, c.dataset.view==='video'?'video':'choice'); }
});
$('#heroPlay').addEventListener('click',()=>openModal({name:'はじめての方へ',title:'みんなの自主トレへようこそ',color:'#3dbb6d',desc:'動画でわかる、かんたん自主トレーニング。毎日の動きが、未来のあなたをつくるます。',video:CONFIG.heroVideo,img:TRAININGS[0].img,pdf:[],noback:true},'video'));

/* ---------- トップの映像（URLを入れたときだけ、写真の上に動画を重ねる） ---------- */
if(CONFIG.heroVideo){
  const v=document.createElement('video');
  v.src=CONFIG.heroVideo; v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true;
  $('#heroPhoto').insertBefore(v,$('#heroPhoto .hero-script'));
  v.play().catch(()=>{});
}

/* ---------- データの保存（Supabase） ---------- */
let sbClient=null;
function getSb(){
  if(sbClient) return sbClient;
  if(!/^https:\/\//.test(CONFIG.SUPABASE_URL)||!CONFIG.SUPABASE_KEY||CONFIG.SUPABASE_KEY.startsWith('ここに'))
    throw new Error('Supabaseの接続情報が未設定です。ファイルの CONFIG に Project URL と Publishable key を貼り付けてください。');
  if(!window.supabase||!window.supabase.createClient)
    throw new Error('Supabaseの読み込みに失敗しました。インターネットの接続を確認してください。');
  sbClient=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
  return sbClient;
}
async function saveMemo(){
  const input=$('#memoInput'), msg=$('#memoMsg'), btn=$('#memoSave');
  if(!input)return;
  const text=input.value.trim();
  msg.className='memo-msg'; msg.textContent='';
  if(!text){ alert('保存する文字を入力してください。'); input.focus(); return; }
  btn.disabled=true; btn.textContent='保存中…';
  try{
    const sb=getSb();
    const {error}=await sb.from(CONFIG.TABLE).insert({[CONFIG.COLUMN]:text});
    if(error) throw error;
    msg.className='memo-msg ok'; msg.textContent='保存成功';
    alert('保存成功');
    input.value='';
  }catch(e){
    const m=(e&&e.message)?e.message:String(e);
    msg.className='memo-msg ng'; msg.textContent='保存できませんでした：'+m;
    alert('エラー：'+m);
  }finally{
    btn.disabled=false; btn.textContent='保存する';
  }
}

/* ---- YouTube ---- */
function ytId(u){
  try{
    const x=new URL(u); const h=x.hostname.replace(/^(www|m)\./,'');
    if(h==='youtu.be') return x.pathname.slice(1).split('/')[0];
    if(h==='youtube.com'||h==='youtube-nocookie.com'){
      if(x.pathname==='/watch') return x.searchParams.get('v')||'';
      const m=x.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{6,})/); if(m) return m[2];
    }
  }catch(e){}
  return '';
}
const ytThumb = u => { const id=ytId(u); return id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:''; };

/* ---- 画像を小さくする（長いほうを最大640px、JPEG） ---- */
function compressImage(file,maxSide=640,quality=0.72){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.max(1,Math.round(im.naturalWidth*s)), h=Math.max(1,Math.round(im.naturalHeight*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve({blob:b,w,h}):reject(new Error('画像を小さくできませんでした')),'image/jpeg',quality);
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした（JPEG・PNGなどを選んでください）')); };
    im.src=url;
  });
}

/* ---- Supabase：データの読み書き ---- */
let ITEMS=null, ITEMS_ERR='';
async function loadItems(force){
  if(ITEMS && !force) return ITEMS;
  ITEMS_ERR='';
  try{
    const sb=getSb();
    const {data,error}=await sb.from(CONFIG.ITEMS_TABLE).select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});
    if(error) throw error;
    ITEMS=data||[];
  }catch(e){ ITEMS=[]; ITEMS_ERR=(e&&e.message)||String(e); }
  return ITEMS;
}
function storagePath(url){ const k='/'+CONFIG.BUCKET+'/'; const i=(url||'').indexOf(k); return i<0?'':decodeURIComponent(url.slice(i+k.length).split('?')[0]); }
async function uploadFile(folder,body,ext,type){
  const sb=getSb();
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from(CONFIG.BUCKET).upload(path,body,{contentType:type,cacheControl:'3600',upsert:false});
  if(error) throw error;
  return sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;
}

/* ---- 公開ページ（目的別・動画・毎日・専門家） ---- */
function tileHtml(it,showSrc){
  const href = safeUrl(it.kind==='pdf'?it.pdf_url:it.video_url);
  const thumb = safeUrl(it.image_url) || (it.kind==='video'?ytThumb(it.video_url):'');
  const srcLabel = showSrc && it.page!=='daily' ? `<small>${esc(PAGES[it.page].no+' '+PAGES[it.page].label)}${it.category?'・'+esc(it.category):''}</small>` : '';
  return `<a class="tile" href="${esc(href)}" target="_blank" rel="noopener">
    <div class="th">${thumb?`<img loading="lazy" alt="" src="${esc(thumb)}">`:`<svg class="i"><use href="#${it.kind==='pdf'?'i-pdf':'i-play'}"/></svg>`}
      <span class="bg ${it.kind==='video'?'v':''}">${it.kind==='pdf'?'PDF':'▶ 動画'}</span></div>
    <div class="tt">${esc(it.title)}${srcLabel}</div></a>`;
}
async function openPage(key){
  const P=PAGES[key]; if(!P) return;
  const box=$('#subpage');
  box.innerHTML=`<div class="sub-top"><button class="sub-back" type="button" id="subBack">← ホームへもどる</button><h2>${P.no} ${P.label}</h2></div><p class="sub-lead">${P.lead}</p><div class="empty-sub">読み込み中…</div>`;
  $('#frame').classList.add('sub'); $('#frame').scrollTop=0; window.scrollTo(0,0);
  $('#subBack').onclick=closePage;
  const items=await loadItems(true);
  let body='';
  if(ITEMS_ERR) body=`<div class="empty-sub">準備中です。<br><small>${esc(ITEMS_ERR)}</small></div>`;
  else if(key==='daily'){
    const list=items.filter(i=>i.page==='daily'||i.daily);
    body=list.length?`<div class="tiles">${list.map(i=>tileHtml(i,true)).join('')}</div>`:'<div class="empty-sub">準備中です。公開までしばらくお待ちください。</div>';
  }else{
    const list=items.filter(i=>i.page===key);
    body=CATS.map(c=>{ const g=list.filter(i=>i.category===c.name);
      return `<div class="sgrp" style="--c:${c.color}"><h3>${esc(c.name)}</h3>${g.length?`<div class="tiles">${g.map(i=>tileHtml(i,false)).join('')}</div>`:'<div class="empty-sub">準備中です</div>'}</div>`; }).join('');
  }
  box.innerHTML=`<div class="sub-top"><button class="sub-back" type="button" id="subBack">← ホームへもどる</button><h2>${P.no} ${P.label}</h2></div><p class="sub-lead">${P.lead}</p>${body}`;
  $('#subBack').onclick=closePage;
}
function closePage(){ $('#frame').classList.remove('sub'); $('#frame').scrollTop=0; window.scrollTo(0,0); } $$('.feat[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));

const adm={open:false,signed:false,page:'purpose',cat:'頭',kind:'pdf',busy:false,msg:'',msgOk:true,img:null,imgInfo:'',title:'',dailyChk:false};
// 種類・部位を切り替えても、入力ずみのタイトルとチェックが消えないようにする

function admConfigured(){ return /^https:\/\//.test(CONFIG.SUPABASE_URL)&&CONFIG.ADMIN_EMAIL&&!CONFIG.ADMIN_EMAIL.startsWith('ここに')&&!CONFIG.SUPABASE_KEY.startsWith('ここに'); }

      <div class="adm-err" id="admErr">${esc(msg||'')}</div>
      <button class="btn-main" type="button" id="admGo" ${ok?'':'disabled'}>ログイン</button></div>`;
  $('#admClose').onclick=closeAdmin;
  if(!ok)return;
  const go=async()=>{
    const pw=$('#admPw').value; if(!pw){ $('#admErr').textContent='パスワードを入力してください。'; return; }
    $('#admGo').disabled=true; $('#admErr').textContent='';

      const {error}=await getSb().auth.signInWithPassword({email:CONFIG.ADMIN_EMAIL,password:pw});

function admRows(list,opt){
  if(!list.length) return '<div class="empty-sub" style="padding:16px">まだありません</div>';
  return list.map(it=>{
    const thumb=safeUrl(it.image_url)||(it.kind==='video'?ytThumb(it.video_url):'');
    return `<div class="arow">
      ${thumb?`<img alt="" src="${esc(thumb)}">`:`<div class="ph">${it.kind==='pdf'?'PDF':'動画'}</div>`}
      <div class="nm"><b>${esc(it.title)}</b><small>${it.kind==='pdf'?'PDF':'動画（YouTube）'}${it.category?'・'+esc(it.category):''}${opt&&opt.src?'・'+esc(PAGES[it.page].no+' '+PAGES[it.page].label):''}</small></div>
      ${opt&&opt.daily?`<label><input type="checkbox" data-daily="${it.id}" ${it.daily?'checked':''}>毎日続けられる</label>`:''}
      <div class="acts">
        ${opt&&opt.unflag?`<button class="btn-sub" type="button" data-unflag="${it.id}">③から外す</button>`:`<button class="btn-sub" type="button" data-rename="${it.id}">題名を変更</button><button class="btn-sub red" type="button" data-del="${it.id}">削除</button>`}
      </div></div>`;
  }).join('');
}
function admRender(){
  const P=PAGES[adm.page];
  if(!P.kinds.includes(adm.kind)) adm.kind=P.kinds[0];
  const items=ITEMS||[];
  let listHtml='';
  if(adm.page==='daily'){
    const flagged=items.filter(i=>i.page!=='daily'&&i.daily), own=items.filter(i=>i.page==='daily');
    listHtml=`<div class="adm-h">①②④で「毎日続けられる」にチェックしたもの</div>${admRows(flagged,{src:true,unflag:true})}
      <div class="adm-h" style="margin-top:18px">③に直接つくったもの</div>${admRows(own,{})}`;
  }else{
    const list=items.filter(i=>i.page===adm.page&&(!P.cats||i.category===adm.cat));
    listHtml=`<div class="adm-h">${P.cats?esc(adm.cat)+' の':''}登録ずみ（${list.length}件）</div>${admRows(list,{daily:P.daily})}`;
  }
  const chips=P.cats?`<div class="chips">${CATS.map(c=>`<button type="button" data-cat="${esc(c.name)}" class="${adm.cat===c.name?'on':''}" style="--c:${c.color}">${esc(c.name)}</button>`).join('')}</div>`:'';
  const kindSel=P.kinds.length>1?`<div class="fld"><label class="lb">種類</label><div class="radio">${P.kinds.map(k=>`<label><input type="radio" name="kind" value="${k}" ${adm.kind===k?'checked':''}>${k==='pdf'?'PDF':'動画（YouTube）'}</label>`).join('')}</div></div>`:'';
  const form=`<div class="aform"><div class="adm-h" style="margin-top:0">新しく追加する</div>
    ${P.cats?`<div class="fld"><label class="lb">部位</label><select id="fCat">${CATS.map(c=>`<option ${adm.cat===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}
    ${kindSel}
    <div class="fld"><label class="lb">タイトル（自由に書けます）</label><input type="text" id="fTitle" maxlength="80" placeholder="例：首のストレッチ" value="${esc(adm.title)}"></div>
    <div class="fld"><label class="lb">画像${adm.kind==='video'?'（なければ、YouTubeの画像を自動で使います）':''}</label><input type="file" id="fImg" accept="image/*">
      <div class="hint">長いほうを640px以下・JPEGに小さくして保存します。</div><div class="prev" id="fPrev"></div></div>
    ${adm.kind==='pdf'
      ?`<div class="fld"><label class="lb">PDFファイル</label><input type="file" id="fPdf" accept="application/pdf,.pdf"><div class="hint">50MBまで</div></div>`
      :`<div class="fld"><label class="lb">YouTubeのURL（限定公開でOK）</label><input type="url" id="fUrl" placeholder="https://youtu.be/xxxxxxxxxxx"></div>`}
    ${P.daily?`<div class="fld"><label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px"><input type="checkbox" id="fDaily" ${adm.dailyChk?'checked':''}>「毎日続けられる」にも載せる（③に表示）</label></div>`:''}
    <button class="btn-main" type="button" id="fSave" ${adm.busy?'disabled':''}>${adm.busy?'保存中…':'保存する'}</button>
    <div class="adm-msg ${adm.msg?(adm.msgOk?'ok':'ng'):''}" id="fMsg">${esc(adm.msg)}</div></div>`;
  const memo=`<div class="aform" style="margin-top:26px"><div class="adm-h" style="margin-top:0">接続テスト（メモを保存）</div>
    <div class="memo-row"><input type="text" id="memoInput" placeholder="保存したい文字" maxlength="500" autocomplete="off"><button type="button" id="memoSave">保存する</button></div><div class="memo-msg" id="memoMsg"></div></div>`;
  $('#admBox').innerHTML=`<div class="adm-hd"><b>管理画面</b><button type="button" id="admLogout">ログアウト</button><button type="button" id="admClose">閉じる</button></div>
    <div class="adm-tabs">${Object.keys(PAGES).map(k=>`<button type="button" data-tab="${k}" class="${adm.page===k?'on':''}">${PAGES[k].no} ${PAGES[k].label}</button>`).join('')}</div>
    <div class="adm-body">${ITEMS_ERR?`<div class="adm-note">データを読み込めませんでした：${esc(ITEMS_ERR)}</div>`:''}${chips}${listHtml}${form}${memo}</div>`;
  admBind();
}
function admBind(){
  const box=$('#admBox');
  $('#admClose').onclick=closeAdmin;
  $('#admLogout').onclick=async()=>{ try{await getSb().auth.signOut();}catch(e){} adm.signed=false; admLoginView(); };
  $$('[data-tab]',box).forEach(b=>b.onclick=()=>{ adm.page=b.dataset.tab; adm.kind=PAGES[adm.page].kinds[0]; adm.msg=''; adm.img=null; adm.imgInfo=''; adm.title=''; adm.dailyChk=false; admRender(); });
  $$('[data-cat]',box).forEach(b=>b.onclick=()=>{ admKeepForm(); adm.cat=b.dataset.cat; adm.msg=''; admRender(); });
  const fc=$('#fCat'); if(fc) fc.onchange=()=>{ admKeepForm(); adm.cat=fc.value; admRender(); };
  $$('input[name=kind]',box).forEach(r=>r.onchange=()=>{ admKeepForm(); adm.kind=r.value; adm.msg=''; admRender(); });
  $('#fImg').onchange=async e=>{
    const f=e.target.files[0]; adm.img=null; $('#fPrev').innerHTML='';
    if(!f)return;
    try{ const r=await compressImage(f); adm.img=r;
      const u=URL.createObjectURL(r.blob);
      $('#fPrev').innerHTML=`<img alt="" src="${u}"><span>${r.w}×${r.h}px・${Math.round(r.blob.size/1024)}KB（元：${Math.round(f.size/1024)}KB）</span>`;
    }catch(err){ $('#fPrev').textContent=err.message; }
  };
  $('#fSave').onclick=admSave;
  // 行の操作
  $$('[data-daily]',box).forEach(c=>c.onchange=()=>admDo(()=>getSb().from(CONFIG.ITEMS_TABLE).update({daily:c.checked}).eq('id',+c.dataset.daily),'更新しました'));
  $$('[data-unflag]',box).forEach(b=>b.onclick=()=>admDo(()=>getSb().from(CONFIG.ITEMS_TABLE).update({daily:false}).eq('id',+b.dataset.unflag),'③から外しました'));
  $$('[data-rename]',box).forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(x=>x.id===+b.dataset.rename); const t=prompt('新しいタイトル',it.title);
    if(t&&t.trim()) admDo(()=>getSb().from(CONFIG.ITEMS_TABLE).update({title:t.trim().slice(0,80)}).eq('id',it.id),'タイトルを変更しました');
  });
  $$('[data-del]',box).forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(x=>x.id===+b.dataset.del); if(!confirm('「'+it.title+'」を削除しますか？'))return;
    admDo(async()=>{
      const paths=[storagePath(it.image_url),storagePath(it.pdf_url)].filter(Boolean);
      if(paths.length){ try{ await getSb().storage.from(CONFIG.BUCKET).remove(paths); }catch(e){} }
      return getSb().from(CONFIG.ITEMS_TABLE).delete().eq('id',it.id);
    },'削除しました');
  });
  const ms=$('#memoSave'); if(ms){ ms.onclick=saveMemo; $('#memoInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); saveMemo(); } }); }
}
async function admDo(fn,okMsg){
  try{ const r=await fn(); if(r&&r.error) throw r.error; await loadItems(true); adm.msg=okMsg; adm.msgOk=true; }
  catch(e){ adm.msg='できませんでした：'+((e&&e.message)||e); adm.msgOk=false; }
  admRender();
}
async function admSave(){
  const P=PAGES[adm.page], msg=$('#fMsg'), btn=$('#fSave');
  const title=$('#fTitle').value.trim();
  const fail=m=>{ msg.className='adm-msg ng'; msg.textContent=m; };
  if(!title) return fail('タイトルを入力してください。');
  let pdfFile=null, videoUrl='';
  if(adm.kind==='pdf'){
    pdfFile=$('#fPdf').files[0];
    if(!pdfFile) return fail('PDFファイルを選んでください。');
    if(pdfFile.type!=='application/pdf'&&!/\.pdf$/i.test(pdfFile.name)) return fail('PDFファイルを選んでください。');
    if(pdfFile.size>50*1024*1024) return fail('PDFが大きすぎます（50MBまで）。');
  }else{
    videoUrl=$('#fUrl').value.trim();
    if(!ytId(videoUrl)) return fail('YouTubeのURLを入力してください。（例：https://youtu.be/xxxxxxxxxxx）');
  }
  btn.disabled=true; btn.textContent='保存中…'; msg.className='adm-msg'; msg.textContent='ファイルを送っています…';
  const uploaded=[];
  try{
    let image_url=null, pdf_url=null;
    if(adm.img){ image_url=await uploadFile('img',adm.img.blob,'jpg','image/jpeg'); uploaded.push(image_url); }
    if(pdfFile){ pdf_url=await uploadFile('pdf',pdfFile,'pdf','application/pdf'); uploaded.push(pdf_url); }
    const row={page:adm.page,category:P.cats?($('#fCat')?$('#fCat').value:adm.cat):null,kind:adm.kind,title,image_url,pdf_url,video_url:videoUrl||null,daily:P.daily?!!$('#fDaily').checked:false};
    const {error}=await getSb().from(CONFIG.ITEMS_TABLE).insert(row);
    if(error) throw error;
    adm.img=null; adm.title=''; adm.dailyChk=false; adm.msg='保存しました'; adm.msgOk=true;
    await loadItems(true); admRender();
  }catch(e){
    // 失敗したときは、送ったファイルを片づける
    const paths=uploaded.map(storagePath).filter(Boolean);
    if(paths.length){ try{ await getSb().storage.from(CONFIG.BUCKET).remove(paths); }catch(_){} }
    btn.disabled=false; btn.textContent='保存する';
    fail('保存できませんでした：'+((e&&e.message)||e));
  }
}

/* ---------- PC／スマホの切り替え ---------- */
function setView(v){
  document.body.dataset.view=v;
  $$('#viewswitch button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#nav').classList.remove('open');
  $('#frame').scrollTop=0;
}
$$('#viewswitch button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
if(window.innerWidth<=760) document.body.dataset.view='sp';   // 実際のスマホではスマホ用の表示

/* ---------- メニュー ---------- */
$('#burger').addEventListener('click',()=>$('#nav').classList.toggle('open'));
function markActive(id){
  $$('#nav a, #tabbar a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));
}
$$('#nav a, #tabbar a, .cta, .btn-green, .btn-white').forEach(a=>a.addEventListener('click',e=>{
  const id=(a.getAttribute('href')||'').slice(1);
  const el=id&&document.getElementById(id);
  if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'}); markActive(id); $('#nav').classList.remove('open'); }
}));
const ids=['home','training','videos','column','faq'];
function onScroll(){
  const inFrame=document.body.dataset.view==='sp'&&window.innerWidth>760;
  const base=inFrame?$('#frame').getBoundingClientRect().top:0;
  let cur2='home';
  ids.forEach(id=>{ const el=document.getElementById(id); if(!el)return;
    if(el.getBoundingClientRect().top-base<140)cur2=id; });
  markActive(cur2);
}
window.addEventListener('scroll',onScroll,{passive:true});
$('#frame').addEventListener('scroll',onScroll,{passive:true});
